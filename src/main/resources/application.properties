# Spring Boot Server Configuration
server.port=8080

# Database Connection Settings (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3307/employee_payroll_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Initialization
spring.sql.init.mode=never

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=PayrollHikariCP

# JWT Authentication Config
# Base64 encoded secret key (256-bit minimum)
jwt.secret=9a4f2c8d3b7a1e5f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8a9b0c1d2e3f
# Expiration: 1 day in milliseconds
jwt.expiration=86400000

# Logging Settings
logging.level.root=INFO
logging.level.com.payroll=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
